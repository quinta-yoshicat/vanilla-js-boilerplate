<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YoshiCat e a Quinta do Moscatel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Tipos de letra locais (assets/fontes/), sem pedidos ao Google Fonts.
       Fontes variáveis (licença OFL, ver LICENSE-*-OFL.txt): Fraunces com
       eixos opsz+wght (pesos 500-700 usados no jogo) e Nunito com wght
       (pesos 400-800). Só os alfabetos latin e latin-ext. */
    @font-face {
      font-family: 'Fraunces';
      font-style: normal;
      font-weight: 500 700;
      font-display: swap;
      src: url('assets/fontes/fraunces-latin-ext-opsz-normal.woff2') format('woff2');
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }
    @font-face {
      font-family: 'Fraunces';
      font-style: normal;
      font-weight: 500 700;
      font-display: swap;
      src: url('assets/fontes/fraunces-latin-opsz-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('assets/fontes/nunito-latin-ext-wght-normal.woff2') format('woff2');
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('assets/fontes/nunito-latin-wght-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Mesma cor de fundo do #fundo/body no <html>: sem isto, um
       arredondamento de sub-pixel no recorte da capa (.fundo-nitido
       pára em "bottom: var(--barra-home)", a camada desfocada vai até
       ao fundo) podia deixar ver, por um instante, o branco por
       omissão do navegador entre a imagem e a barra de botões. */
    html {
      background: #0a1226;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      min-height: 100vh;
      background-color: #0a1226;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 10px;
      position: relative;
      --barra-home: calc(76px + env(safe-area-inset-bottom, 0px));
      /* Coluna do jogo: largura de telemóvel, também no PC */
      --coluna: min(100vw, 480px);
    }

    /* -----------------------------------------------------------------
       FUNDOS (definidos em definirFundo() no js/main.js)
       - modo-capa: ecrã inicial, capa inteira visível + versão desfocada
         a preencher os lados/baixo, sem cortes.
       - modo-paisagem: a parte de cima da capa (céu, lua, casa e vinha,
         até 59% da altura — o YoshiCat começa a 61%), inteira na coluna.
       - modo-foto: uma imagem da história (Vinha e Criar Garrafa),
         inteira na largura da coluna, presa ao topo.
       Nos modos paisagem e foto, a camada desfocada é a mesma imagem,
       escura, a preencher o resto do ecrã e os lados no PC.
       ----------------------------------------------------------------- */
    #fundo {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background-color: #0a1226;
    }

    #fundo > div {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
    }

    #fundo .fundo-desfocado {
      background-size: cover;
      background-position: center;
      filter: blur(28px) brightness(0.4);
      transform: scale(1.15);
    }

    #fundo.modo-capa .fundo-desfocado {
      background-image: url('Yoshi_Cat.jpg');
    }

    #fundo.modo-capa .fundo-nitido {
      background-image: url('Yoshi_Cat.jpg');
      background-size: cover;
      /* "bottom -12px": a própria Yoshi_Cat.jpg tem uma faixa quase
         branca nas últimas ~10 linhas de píxeis (canto de exportação da
         foto) — sem este afastamento, "bottom" sozinho encostava essa
         faixa exatamente à borda de baixo, mostrando-a como uma risca
         clara entre a foto e a barra de botões. O deslocamento esconde
         essa faixa (fica fora da caixa) sem tocar no ficheiro da foto.
         Não confundir com o "pos" que definirFundo() (js/main.js) passa
         por parâmetro — este é sempre fixo, só para a capa. */
      background-position: center bottom -12px;
      bottom: var(--barra-home);
    }

    /* Desfocada da paisagem: só a parte de cima da capa, sem o gato */
    #fundo.modo-paisagem .fundo-desfocado {
      background-image: url('Yoshi_Cat.jpg');
      background-position: center top;
      bottom: auto;
      height: 170vh;
    }

    /* Caixa da foto: MESMA regra em todos os ecrãs (menos o inicial) —
       mesma altura, proporcional à largura da coluna. A foto preenche a
       caixa toda (background-size: cover) e o que sobra é cortado, em
       vez de a foto encolher para caber. Por isso todas as fotos ficam
       do mesmo tamanho, seja qual for a proporção original de cada uma. */
    #fundo.modo-paisagem .fundo-nitido,
    #fundo.modo-foto .fundo-nitido {
      left: 50%;
      right: auto;
      bottom: auto;
      width: var(--coluna);
      height: calc(var(--coluna) * 0.95);
      transform: translateX(-50%);
      background-size: cover;
      background-position: center top;
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 60px), transparent 100%);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 60px), transparent 100%);
    }

    #fundo.modo-paisagem .fundo-nitido {
      background-image: url('Yoshi_Cat.jpg');
    }

    /* Escurecimento leve só na parte de baixo, onde fica a janela */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.1) 35%,
        rgba(0,0,0,0) 55%
      );
      z-index: 1;
    }

    /* -----------------------------------------------------------------
       JANELA DOS ECRÃS (todos menos o inicial): encostada em baixo,
       semitransparente, para se ver a cena por cima dela
       ----------------------------------------------------------------- */
    .screen.content:not(#screen-home) {
      background: rgba(10, 12, 20, 0.45);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(245, 215, 110, 0.25);
      border-radius: 18px;
      padding: 12px 12px 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .screen:not(#screen-home) .btn {
      padding: 11px;
      margin: 7px 0;
      font-size: 16px;
      text-shadow: none;
    }

    .screen:not(#screen-home) .choice-list .btn {
      padding-left: 18px;
    }

    .screen:not(#screen-home) h2 {
      font-size: 19px;
      margin-bottom: 6px;
    }

    .game-subtitle {
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .game-result:empty {
      display: none;
    }

    /* No ecrã inicial a capa fica limpa, sem escurecimento */
    body.tela-home .overlay {
      display: none;
    }

    /* Texto que continua na página (para leitores de ecrã) mas não se vê */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Ecrã inicial: botões pequenos, lado a lado, na faixa de baixo */
    body.tela-home {
      padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    }

    .home-botoes {
      display: flex;
      gap: 10px;
    }

    .home-botoes .btn {
      flex: 1;
      margin: 0;
      padding: 11px 8px;
      font-size: 15px;
      border-radius: 12px;
    }

    .home-botoes .btn-secondary {
      background: rgba(15, 15, 20, 0.7);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }

    /* Ecrãs do jogo: só o ecrã ativo fica visível */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 26px;
      color: #f5d76e;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      line-height: 1.3;
    }

    h2 {
      font-size: 21px;
      color: #f5d76e;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      line-height: 1.3;
    }

    .subtitle {
      font-size: 16px;
      color: #f0f0f0;
      margin-bottom: 28px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 12px 0;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      color: #1a1a1a;
    }

    .btn-secondary {
      background: rgba(20, 20, 26, 0.7);
      color: white;
      border: 1px solid #666;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Barra de estatísticas (Uvas, Gotas, Reputação, Garrafas) */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 7px 8px;
      margin-bottom: 10px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 60px;
      flex: 1;
    }

    .stat-icon {
      font-size: 18px;
    }

    .stat-value {
      font-weight: 700;
      color: #f5d76e;
      font-size: 15px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .stat-label {
      font-size: 10px;
      color: #ddd;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .info-text {
      font-size: 14px;
      color: #eee;
      margin-bottom: 18px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      line-height: 1.4;
    }

    /* Linha do estado da nuvem no Perfil (ver nuvemTextoEstado() em js/nuvem.js) */
    .info-text.nuvem-estado { font-size: 11px; opacity: 0.8; overflow-wrap: anywhere; }

    .game-subtitle {
      font-size: 13px;
      color: #f5d76e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .game-question {
      font-size: 16px;
      color: #fff;
      margin-bottom: 18px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      line-height: 1.4;
    }

    .game-result {
      font-size: 14px;
      color: #f0f0f0;
      margin-bottom: 10px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.95);
    }

    .choice-list .btn {
      text-align: left;
      padding-left: 22px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
    }

    .option-card {
      background: rgba(20, 20, 26, 0.65);
      border: 1px solid #666;
      border-radius: 14px;
      padding: 16px 8px;
      font-size: 28px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s ease;
    }

    .option-card:active {
      transform: scale(0.94);
    }

    .option-card .option-label {
      font-size: 12px;
      color: #ddd;
      margin-top: 6px;
    }

    .rps-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 20px 0;
    }

    .rps-btn {
      font-size: 30px;
      background: rgba(20, 20, 26, 0.65);
      border: 1px solid #666;
      border-radius: 50%;
      width: 68px;
      height: 68px;
      cursor: pointer;
    }

    .rps-btn:active {
      transform: scale(0.92);
    }

    .progress-bar-outer {
      width: 100%;
      height: 16px;
      background: rgba(20, 20, 26, 0.65);
      border: 1px solid #666;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar-inner {
      height: 100%;
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      width: 0%;
      transition: width 0.3s ease;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .profile-card {
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 18px 10px;
    }

    .profile-card .stat-icon {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .profile-card .stat-value {
      font-size: 20px;
    }

    .story-box {
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      font-size: 15px;
      line-height: 1.5;
      color: #f0f0f0;
      text-align: left;
      min-height: 90px;
    }

    /* Vinha (telemóvel e PC): tudo mais compacto, para caber no ecrã sem
       deslizar e deixar ver mais da foto de fundo */
    #screen-vinha h2 { font-size: 19px; margin-bottom: 6px; }
    #screen-vinha .phase-card { padding: 10px 12px; margin-bottom: 8px; }
    #screen-vinha .phase-nome { font-size: 15px; margin-bottom: 3px; }
    #screen-vinha .phase-desc { font-size: 13px; line-height: 1.35; margin-bottom: 4px; }
    #screen-vinha .stats-bar { padding: 6px 10px; margin-bottom: 8px; }
    #screen-vinha .stat-item { flex-direction: row; justify-content: center; gap: 6px; }
    #screen-vinha .stat-icon { font-size: 16px; }
    #screen-vinha .game-result { font-size: 13px; line-height: 1.35; margin-bottom: 4px; }
    #screen-vinha .game-subtitle { font-size: 12px; margin-bottom: 4px; }
    #screen-vinha .story-box { padding: 10px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.35; }

    /* Adega (dentro de "Criar Garrafa") no telemóvel: mesma compactação
       da Vinha, e a notícia da Enciclopédia (.story-box) mais pequena,
       porque aqui pode aparecer junto com o cartão da Cave e 3 botões */
    #screen-garrafa h2 { font-size: 19px; margin-bottom: 6px; }
    #screen-garrafa .phase-card { padding: 10px 12px; margin-bottom: 8px; }
    #screen-garrafa .phase-nome { font-size: 15px; margin-bottom: 3px; }
    #screen-garrafa .phase-desc { font-size: 13px; line-height: 1.35; margin-bottom: 4px; }
    #screen-garrafa .phase-progress { font-size: 12px; }
    /* 4 recursos nesta barra (Uvas, Gotas, Bagaço, Aguardente) — mantém a
       disposição em coluna (ícone/valor/etiqueta), que já funciona bem
       com 4 colunas estreitas no Menu da Quinta; só encolhe um pouco. */
    #screen-garrafa .stats-bar { padding: 8px 4px; margin-bottom: 8px; }
    #screen-garrafa .stat-icon { font-size: 15px; }
    #screen-garrafa .stat-value { font-size: 14px; }
    #screen-garrafa .stat-label { font-size: 9px; }
    #screen-garrafa .game-result { font-size: 13px; line-height: 1.35; margin-bottom: 4px; }
    #screen-garrafa .game-subtitle { font-size: 12px; margin-bottom: 4px; }
    #screen-garrafa .story-box { padding: 10px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.35; }

    /* Perfil no telemóvel: 3 colunas de cartões mais compactos, para caber
       mesmo com a galeria de garrafas e o título especial */
    @media (max-width: 599px) {
      .profile-grid { grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
      .profile-card { padding: 10px 4px; }
      .profile-card .stat-icon { font-size: 20px; margin-bottom: 2px; }
      .profile-card .stat-value { font-size: 17px; }
      #perfil-container .bottle-gallery { font-size: 20px; margin-bottom: 12px; }
      #screen-perfil h2 { margin-bottom: 6px; }
      #perfil-container .info-text { margin-bottom: 10px; }
      #perfil-container .badge-title { margin-bottom: 10px; }
    }

    /* Perfil: esbatido dourado no fundo do cartão = há mais por baixo;
       some quando se chega ao fim (classe "fim", ver perfilAtualizarPainel()
       em js/perfil.js). Ocupa 0 de altura (margem negativa). */
    #perfil-container .scroll-panel::after {
      content: '';
      display: block;
      position: sticky;
      bottom: -10px;
      height: 36px;
      margin: -36px -12px -10px;
      background: linear-gradient(to bottom, rgba(245, 215, 110, 0), rgba(245, 215, 110, 0.5));
      border-radius: 0 0 14px 14px;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #perfil-container .scroll-panel.fim::after { opacity: 0; }

    /* Fase atual da Vinha */
    .phase-card {
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .phase-nome {
      font-size: 17px;
      font-weight: 700;
      color: #f5d76e;
      margin-bottom: 6px;
    }

    .phase-desc {
      font-size: 14px;
      color: #f0f0f0;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .phase-progress {
      font-size: 13px;
      color: #ddd;
    }

    /* Cave de Reserva (vitrine dentro do cartão da Adega — ver reservaHtml()
       em js/garrafa.js) */
    .reserva-bloco { margin-top: 10px; }
    /* Botão de entrada em "A Coleção" (Nível 6 — ver colecaoBotaoEntradaHtml() em js/garrafa.js) */
    .reserva-bloco .colecao-entrada { margin: 0 0 8px; }
    /* Botão "Visitar a Reserva" (nível 5 — ver reservaBotaoHtml() em js/reserva.js) */
    .reserva-bloco .reserva-visita-botao { display: flex; width: 100%; margin: 0 0 8px; white-space: normal; text-align: center; justify-content: center; min-height: 40px; }
    .reserva-visita-botao:disabled, .colecao-arrumar-botao:disabled { opacity: 0.55; cursor: default; }
    /* A Adega com o cartão aberto mostra mais da Cave de Reserva (a foto, "Ver a Coleção" e "Visitar a Reserva" sem deslizar) */
    #garrafa-container .topcard.aberto { max-height: 58vh; }
    .reserva-foto {
      display: block;
      width: 100%;
      height: 110px;
      object-fit: cover;
      object-position: center 35%;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    /* Página da garrafa (ver renderEngarrafar() em js/garrafa.js): garrafa
       grande com a legenda por cima, barra até à cor seguinte por baixo.
       O painel nunca passa da altura que sobra entre o topo e os botões
       (--engarrafar-acao = altura do painel de botões, medida por JS), e a
       foto é o menor entre 80% da largura e a altura que sobra. */
    .scroll-panel.garrafa-pagina {
      --dispo: calc(100vh - var(--topo-altura) - 60px - var(--nav-altura) - 16px - var(--engarrafar-acao, 110px));
      --reserva: 96px;  /* barra + tempo + Reputação + margens */
      max-height: var(--dispo);
    }
    @supports (height: 100dvh) {
      .scroll-panel.garrafa-pagina {
        --dispo: calc(100dvh - var(--topo-altura) - 60px - var(--nav-altura) - 16px - var(--engarrafar-acao, 110px));
      }
    }
    .scroll-panel.garrafa-pagina.resultado { --reserva: 180px; } /* + texto e resultado */
    .garrafa-grande {
      position: relative;
      width: min(80%, max(88px, calc(var(--dispo) - var(--reserva))));
      margin: 0 auto 10px;
      container-type: inline-size; /* a legenda acompanha o tamanho da foto */
    }
    .garrafa-grande-foto {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
    }
    /* A foto da cor seguinte, por cima da atual, com a opacidade da barra. */
    .garrafa-fusao {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      transition: opacity 2s linear;
    }
    .garrafa-grande-legenda {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      margin: 0;
      padding: 8px 10px 22px;
      border-radius: 12px 12px 0 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0));
      text-align: center;
      font-size: 12px;
      font-size: clamp(10px, 6.2cqw, 15px);
      white-space: nowrap;
      font-weight: 700;
      color: #f5d76e;
    }
    /* Bolhas pequenas a subir dentro do corpo da garrafa (a caixa vem de
       GARRAFAS_CORPO). Só correm com a página aberta e a app visível
       (".viva", ligada por js/garrafa.js); sem movimento reduzido, nada. */
    .garrafa-bolhas { position: absolute; overflow: hidden; pointer-events: none; }
    .bolha {
      position: absolute;
      bottom: 0;
      width: calc(var(--s) * 1%);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.12));
      opacity: 0;
      animation: bolha-subir linear infinite;
      animation-play-state: paused;
    }
    .garrafa-pagina.viva .bolha { animation-play-state: running; }
    @keyframes bolha-subir {
      0%   { bottom: 0;    opacity: 0;    transform: translateX(0); }
      15%  {               opacity: 0.55; }
      50%  {                              transform: translateX(2px); }
      85%  {               opacity: 0.3; }
      100% { bottom: 92%;  opacity: 0;    transform: translateX(-1px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .garrafa-bolhas { display: none; }
      .garrafa-fusao { transition: none; }
    }

    /* Garrafa escura na Fechadura do Proteger (ver garrafaEscuraMiniaturaHtml()
       em js/proteger.js): miniatura com o nome e os dias, dentro do cartão do topo. */
    .proteger-garrafa { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .proteger-garrafa-foto {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      flex: none;
    }
    .proteger-garrafa-nome { font-size: 12.5px; font-weight: 700; color: #f5d76e; line-height: 1.25; }

    .cooldown-suffix {
      font-size: 12px;
      opacity: 0.8;
      margin-left: 4px;
    }

    /* Vantagem da estação, junto ao nome do botão (Parte A das estações) */
    .bonus-suffix {
      font-size: 12px;
      opacity: 0.95;
      margin-left: 4px;
      color: #d7ffb8;
      font-weight: 700;
    }

    /* Linha "Outono · Setembro — época de vindima" no Menu da Quinta */
    .estacao-linha {
      font-size: 14px;
      color: #f5d76e;
      margin-bottom: 16px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    /* Linha "Setúbal agora: ..." (tempo real, ver js/tempo.js). Fica
       vazia e sem espaço quando ainda não há dados disponíveis. */
    .tempo-linha {
      font-size: 13px;
      color: #e8e8e8;
      margin-top: -10px;
      margin-bottom: 16px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    .tempo-linha:empty {
      display: none;
    }

    /* Faixa da festa ativa (ver js/festas.js), no ecrã da Quinta.
       Começa escondida; o JS mostra-a e preenche o texto só quando há
       uma festa a decorrer. */
    .festa-faixa {
      display: none;
      background: linear-gradient(135deg, #d4622a, #8a3b12);
      color: #fff;
      border: 1px solid rgba(255, 210, 160, 0.5);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      cursor: pointer;
    }

    /* Nível da Quinta e "Hoje na Quinta" (ver js/niveis.js e
       js/objetivos.js) — vivem dentro do topcard da Quinta, por isso
       reaproveitam .mini-sub e a mesma borda de separação do
       .cartao-corpo, em vez de teres outro cartão flutuante. */
    .mini-bloco {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(245, 215, 110, 0.25);
    }

    .mini-bloco-titulo {
      font-size: 13px;
      font-weight: 700;
      color: #f5d76e;
      margin: 0 0 4px;
    }

    .nivel-barra {
      height: 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.18);
      overflow: hidden;
      margin: 4px 0 4px;
    }

    .nivel-barra-cheio {
      height: 100%;
      background: var(--dourado);
    }

    .objetivo-linha {
      font-size: 12.5px;
      color: #f0e6d8;
      margin: 0 0 2px;
    }

    /* Cumprido: fica verde-claro e um pouco esbatido (sem rasurado —
       não deve parecer "cancelado", é o contrário: já foi feito). */
    .objetivo-linha.feito {
      color: #d7ffb8;
      opacity: 0.85;
    }

    .objetivo-premio {
      opacity: 0.75;
      font-size: 11.5px;
      margin-left: 2px;
    }

    /* Linha "Hoje: {nome} está na Quinta" (ver js/visitas.js): tocável, com
       área de toque de 44px. */
    .visita-linha {
      display: block;
      width: 100%;
      min-height: 44px;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      font: inherit;
      font-size: 12.5px;
      color: #f5d76e;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .visita-linha.feita {
      color: #d7ffb8;
      opacity: 0.85;
    }

    .objetivo-bonus-linha {
      margin-top: 4px;
      font-style: italic;
    }

    /* Enciclopédia do Moscatel */
    .encyclopedia-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 16px 0;
      text-align: left;
      max-height: 48vh;
      overflow-y: auto;
    }

    /* Livro de Conquistas: cabeçalho decorativo (imagem larga, sem texto) entre
       o cartão do topo e a lista. Fixo como os outros painéis; a lista desce por
       baixo dele e encolhe para o botão Voltar ficar sempre visível. */
    .livro-cabecalho {
      --livro-cab-larg: min(var(--coluna), 100vw - 20px);
      --livro-cab-alt: calc(var(--livro-cab-larg) * 0.357); /* proporção do recorte (720x257) */
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(var(--topo-altura) + 53px);
      width: var(--livro-cab-larg);
      height: var(--livro-cab-alt);
      object-fit: cover;
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      z-index: 14;
      pointer-events: none;
    }

    .scroll-panel.conquistas-lista {
      margin: 0;
      top: calc(var(--topo-altura) + 53px + min(var(--coluna), 100vw - 20px) * 0.357 + 8px);
      max-height: min(48vh, calc(100vh - var(--topo-altura) - 53px - min(var(--coluna), 100vw - 20px) * 0.357 - 8px - var(--nav-altura) - 66px));
    }

    /* Ecrã "A Coleção" (ver renderColecao() em js/garrafa.js): grelha 2x2 fixa entre o
       cartão do topo e o botão Voltar, sem deslizar; as fotos ocupam a altura que sobra. */
    .colecao-painel {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(var(--topo-altura) + 60px);
      bottom: calc(var(--nav-altura) + 8px + 44px + 8px + 44px + 8px + 52px + 8px); /* Voltar + "Arrumar a Coleção" + "As minhas garrafas" */
      width: var(--coluna);
      max-width: calc(100vw - 20px);
      z-index: 14;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
    }
    /* Ecrã "As Garrafas" (ver renderGarrafas() em js/garrafa.js): lista que desliza entre o
       cartão do topo e o botão Voltar, como a do Livro de Conquistas. */
    .scroll-panel.garrafas-lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - var(--topo-altura) - 60px - var(--nav-altura) - 8px - 52px - 8px);
    }
    @supports (height: 100dvh) {
      .scroll-panel.garrafas-lista {
        max-height: calc(100dvh - var(--topo-altura) - 60px - var(--nav-altura) - 8px - 52px - 8px);
      }
    }
    .garrafa-linha { padding: 10px 14px; font-size: 14px; flex: 0 0 auto; }

    /* Ecrã "A Estrada" (ver renderEstrada() em js/estrada.js): cartões dos vizinhos numa lista
       que desliza entre o cartão do topo e o botão Voltar, como "As Garrafas". */
    .scroll-panel.estrada-lista {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100vh - var(--topo-altura) - 60px - var(--nav-altura) - 8px - 52px - 8px);
    }
    @supports (height: 100dvh) {
      .scroll-panel.estrada-lista {
        max-height: calc(100dvh - var(--topo-altura) - 60px - var(--nav-altura) - 8px - 52px - 8px);
      }
    }
    .estrada-cartao {
      flex: 0 0 auto;
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      overflow: hidden;
    }
    .estrada-cena { position: relative; height: 84px; }
    .estrada-cena .estrada-foto { display: block; width: 100%; height: 100%; object-fit: cover; }
    .estrada-cena .estrada-cara {
      position: absolute;
      left: 8px;
      bottom: 8px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f5d76e;
      background: #2a1a1a;
    }
    .estrada-texto { padding: 8px 10px 10px; font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
    .estrada-nome { margin: 0; font-size: 14px; font-weight: 700; color: #f5d76e; }
    .estrada-papel { font-weight: 400; color: #e8e8e8; }
    .estrada-texto p { margin: 2px 0 0; }
    .estrada-fala { margin-top: 6px; font-style: italic; color: #fff; }
    .estrada-botao { display: flex; width: 100%; margin-top: 8px; white-space: normal; text-align: center; }
    .estrada-botao:disabled { opacity: 0.55; cursor: default; }
    .estrada-estado { font-size: 12.5px; color: #e8e8e8; }
    .estrada-resultado { margin-top: 8px; padding: 6px 8px; border: 1px solid rgba(245, 215, 110, 0.5); border-radius: 10px; background: rgba(245, 215, 110, 0.1); }
    /* Oferecer a uma visita (cartão da Quinta, ver estradaOfertaHtml() em js/estrada.js) */
    .oferta-botao { display: flex; width: 100%; margin-top: 4px; white-space: normal; text-align: center; }
    .oferta-botao:disabled { opacity: 0.55; cursor: default; }
    .oferta-linha { margin: 0; font-size: 12.5px; color: #d7ffb8; opacity: 0.85; }
    .oferta-resultado { padding: 6px 8px; border: 1px solid rgba(245, 215, 110, 0.5); border-radius: 10px; background: rgba(245, 215, 110, 0.1); font-size: 12.5px; }
    .oferta-resultado p { margin: 2px 0 0; }
    .oferta-fala { font-style: italic; }
    /* O Lagar (ver lagarDesenhar() em js/lagar.js): caixa com o texto por cima da foto, para se ler bem */
    .lagar-info { padding: 8px 10px; border-radius: 12px; background: var(--vinho-escuro-forte); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(245, 215, 110, 0.3); text-align: center; font-size: 13px; line-height: 1.35; color: #fff; }
    .lagar-info p { margin: 0; }
    .lagar-info p + p { margin-top: 4px; }
    .lagar-info .lagar-ok { color: #f5d76e; font-weight: 700; }
    .lagar-botao:disabled, .lagar-botao-mesa:disabled, .lagar-botao-assalto:disabled { opacity: 0.55; cursor: default; }
    /* Até três tarefas + Voltar: mais alto do que o painel de ações normal (42vh), com scroll se o ecrã for mais baixo */
    #lagar-container .action-panel { max-height: calc(100vh - 200px); gap: 6px; }
    #lagar-container .action-panel .btn-pill { min-height: 44px; }
    /* A Câmara (ver camaraDesenhar() em js/camara.js): como o Lagar, caixa com o texto por cima da foto */
    .camara-info { padding: 8px 10px; border-radius: 12px; background: var(--vinho-escuro-forte); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(245, 215, 110, 0.3); text-align: center; font-size: 13px; line-height: 1.35; color: #fff; }
    .camara-info p { margin: 0; }
    .camara-info p + p { margin-top: 4px; }
    .camara-info .camara-ok { color: #f5d76e; font-weight: 700; }
    .camara-botao:disabled { opacity: 0.55; cursor: default; }
    #camara-container .action-panel { max-height: calc(100vh - 200px); gap: 6px; }
    #camara-container .action-panel .btn-pill { min-height: 44px; }
    /* A Cepa Roxa (ver roxoDesenhar() em js/roxo.js): como a Câmara, caixa com o texto por cima da foto */
    .roxo-info { padding: 8px 10px; border-radius: 12px; background: var(--vinho-escuro-forte); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(245, 215, 110, 0.3); text-align: center; font-size: 13px; line-height: 1.35; color: #fff; }
    .roxo-info p { margin: 0; }
    .roxo-info p + p { margin-top: 4px; }
    .roxo-info .roxo-ok { color: #f5d76e; font-weight: 700; }
    .roxo-botao:disabled { opacity: 0.55; cursor: default; }
    #roxo-container .action-panel { max-height: calc(100vh - 200px); gap: 6px; }
    #roxo-container .action-panel .btn-pill { min-height: 44px; }
    /* A Loja da Quinta (ver lojaDesenhar() em js/loja.js): como a Cepa Roxa, caixa com o texto por cima da foto */
    .loja-info { padding: 8px 10px; border-radius: 12px; background: var(--vinho-escuro-forte); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(245, 215, 110, 0.35); color: #fff; font-size: 13.5px; line-height: 1.35; }
    .loja-info p { margin: 0; }
    .loja-info p + p { margin-top: 4px; }
    .loja-info .loja-ok { color: #f5d76e; font-weight: 700; }
    .loja-botao:disabled { opacity: 0.55; cursor: default; }
    #loja-container .action-panel { max-height: calc(100vh - 200px); gap: 6px; }
    #loja-container .action-panel .btn-pill { min-height: 44px; }
    .estrada-aviso { margin: 0; padding: 4px 4px 2px; text-align: center; font-size: 13px; color: #f5d76e; }
    /* O Explorar (ver enterExplorar() em js/explorar.js): cartão da Enciclopédia e um cartão com foto por sítio, no estilo
       dos cartões da Estrada mas com a foto mais alta (640x340 a 312 px de largura = cerca de 166 px). Sem Voltar por baixo. */
    .scroll-panel.explorar-lista {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100vh - var(--topo-altura) - 60px - var(--nav-altura) - 8px - 8px);
    }
    @supports (height: 100dvh) {
      .scroll-panel.explorar-lista {
        max-height: calc(100dvh - var(--topo-altura) - 60px - var(--nav-altura) - 8px - 8px);
      }
    }
    .explorar-cartao {
      flex: 0 0 auto;
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      overflow: hidden;
    }
    .explorar-foto { display: block; width: 100%; height: auto; object-fit: cover; background: #2a1a1a; }
    .explorar-texto { padding: 8px 10px 10px; font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
    .explorar-nome { margin: 0; font-size: 14px; font-weight: 700; color: #f5d76e; }
    .explorar-etiqueta { margin: 2px 0 0; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #d7ffb8; }
    .explorar-frase { margin: 2px 0 0; }
    .explorar-novo { font-weight: 700; color: #fff; }
    .explorar-botao { display: flex; width: 100%; margin-top: 8px; white-space: normal; text-align: center; }

    .colecao-cor {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: rgba(12, 14, 22, 0.88);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 6px;
    }
    /* Por fazer: só a foto se esbate; o cartão e o nome ficam normais. */
    .colecao-cor.por-fazer img { opacity: 0.4; filter: grayscale(0.6); }
    .colecao-cor img {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      object-fit: cover;
      border-radius: 10px;
    }
    .colecao-nome {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 6px 0 0;
      font-size: 14px;
      font-weight: 700;
      color: #f5d76e;
    }

    .encyclopedia-card {
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 14px 16px;
    }

    /* Só algumas entradas (ex: o Magusto) têm foto própria — ver
       "imagem" em ENCYCLOPEDIA_ENTRIES, js/explorar.js. */
    .encyclopedia-card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 8px;
      display: block;
    }

    .encyclopedia-card h3 {
      color: #f5d76e;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .encyclopedia-card p {
      font-size: 13px;
      color: #f0f0f0;
      line-height: 1.4;
    }

    .encyclopedia-card.locked {
      opacity: 0.45;
      border-style: dashed;
    }

    .encyclopedia-card.locked h3 {
      color: #aaa;
    }

    /* Título especial e galeria de garrafas (Perfil) */
    .badge-title {
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      color: #1a1a1a;
      font-weight: 700;
      font-size: 14px;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 18px;
    }

    .bottle-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 24px;
    }

    /* Ajustes para ecrãs maiores (PC) */
    @media (min-width: 600px) {
      /* Janela encostada em baixo, dentro da coluna, como no telemóvel */
      body {
        justify-content: flex-end;
        padding: 0 40px 20px;
      }

      /* Ecrã inicial: botões em baixo, sem quadro por cima da capa */
      body.tela-home {
        padding: 0 40px calc(18px + env(safe-area-inset-bottom, 0px));
      }

      #screen-home.content {
        max-width: 360px;
      }

      .content {
        max-width: 440px;
        max-height: 85vh;
        overflow-y: auto;
      }

      h1 {
        font-size: 28px;
      }

      .btn {
        font-size: 18px;
        padding: 16px;
      }
    }

    /* ===================================================================
       NOVO ASPETO — todos os ecrãs do jogo (topo, navegação, cartão do
       canto, painel de ações, balão de fala). Liga-se com a classe
       "jogo-cheio" no body (ver atualizarChromeNovoAspeto() em
       js/main.js) — só a capa e a Escolher Língua ficam de fora.
       =================================================================== */
    :root {
      --topo-offset: calc(10px + env(safe-area-inset-top, 0px) + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
      --topo-altura: calc(44px + 16px + var(--topo-offset));
      --nav-offset: calc(env(safe-area-inset-bottom, 0px) + var(--tg-safe-area-inset-bottom, 0px));
      --nav-altura: calc(60px + var(--nav-offset));
      --vinho-escuro: rgba(34, 16, 22, 0.62);
      --vinho-escuro-forte: rgba(30, 12, 18, 0.72);
      /* Mais opaco que --vinho-escuro de propósito: a barra de topo e o
         botão do Perfil ficam por cima de qualquer imagem (céu claro,
         nuvens, etc.) e precisam de contraste constante. */
      --topo-fundo: rgba(34, 16, 22, 0.8);
      --dourado: #E0B252;
    }

    /* "jogo-cheio" liga o novo aspeto (topo, navegação, fundo em ecrã
       inteiro) em qualquer ecrã do jogo — todos menos a capa e a escolha
       de língua (ver atualizarChromeNovoAspeto() em js/main.js). */
    .app-chrome { display: none; }

    body.jogo-cheio .app-chrome {
      display: flex;
    }

    /* O balão de fala só aparece quando tem mensagem — isso é controlado
       por [hidden] (ver atualizarDialogo() em js/main.js), por isso não
       entra no toggle genérico ".app-chrome" de cima (que é sempre
       "display:flex" em qualquer ecrã do jogo). */
    #app-dialogue[hidden] { display: none; }

    body.jogo-cheio {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* --- Barra de topo: Perfil + recursos ------------------------------- */
    #app-topbar {
      position: fixed;
      top: var(--topo-offset);
      left: 50%;
      transform: translateX(-50%);
      width: var(--coluna);
      max-width: calc(100vw - 20px);
      z-index: 20;
      align-items: center;
      gap: 8px;
    }

    .profile-btn {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--topo-fundo);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1.5px solid var(--dourado);
      color: #fff5df;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    /* Foto do Telegram dentro do botão do Perfil (ver fotoTelegramNoBotao()
       em js/perfil.js) — só aparece depois de carregar; senão fica o SVG. */
    .profile-btn .profile-foto {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .resource-bar {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      height: 40px;
      padding: 0 10px;
      background: var(--topo-fundo);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(245, 215, 110, 0.35);
      border-radius: 20px;
      min-width: 0;
    }

    .resource-item {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #f5d76e;
      font-weight: 700;
      font-size: 13px;
      min-width: 0;
    }

    .resource-item svg { flex: 0 0 auto; opacity: 0.9; }

    #tempo-linha { margin: 2px 0 0; text-shadow: none; }

    /* --- Faixa da festa: dentro do cartão do topo, por baixo do resto -- */
    #screen-quinta .festa-faixa {
      margin: 6px 0 0;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 10px;
    }

    /* --- Cartão flutuante do canto superior esquerdo: encostado abaixo
       do botão do Perfil, só com a largura necessária, e que abre/fecha
       ao tocar. Genérico — usado pela Vinha agora, pronto para outros
       ecrãs mais tarde (basta dar-lhe a classe "topcard"). ------------- */
    .topcard {
      position: fixed;
      left: calc(50% - (var(--coluna) / 2));
      top: calc(var(--topo-offset) + 44px + 8px);
      width: fit-content;
      max-width: calc(var(--coluna) * 0.6);
      z-index: 18;
      background: var(--vinho-escuro);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(245, 215, 110, 0.35);
      border-radius: 16px;
      padding: 8px 10px;
    }

    /* Aberto, o cartão (cabeçalho + conteúdo) nunca passa do meio do ecrã. */
    .topcard.aberto {
      max-height: 50vh;
      overflow-y: auto;
    }

    /* Encolhido, o corpo fica escondido — só o cabeçalho (título +
       resumo curto) fica visível. Na Vinha/Adega isto nunca chega a
       fazer diferença (o corpo nem é desenhado quando encolhido), mas
       a Quinta desenha o corpo sempre e alterna esta classe. */
    .topcard:not(.aberto) .cartao-corpo {
      display: none;
    }

    .topcard-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 44px;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      text-align: left;
      color: inherit;
      cursor: pointer;
    }

    .cartao-textos {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .topcard h1,
    .topcard .mini-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      color: #f5d76e;
      text-shadow: none;
    }

    .topcard .mini-sub {
      font-size: 12px;
      color: #f0e6d8;
    }

    .cartao-seta {
      flex: 0 0 auto;
      margin-top: 4px;
      color: #f5d76e;
      transition: transform 0.15s ease;
    }

    .topcard.aberto .cartao-seta {
      transform: rotate(180deg);
    }

    .cartao-corpo {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(245, 215, 110, 0.25);
      font-size: 12.5px;
      line-height: 1.35;
    }

    .cartao-corpo .phase-desc,
    .cartao-corpo .phase-desc-real,
    .cartao-corpo .phase-progress {
      margin: 0 0 4px;
    }

    .cartao-corpo .phase-desc-real {
      color: #d7c9b8;
      font-style: italic;
    }

    .chrome-mini-stats {
      display: flex;
      gap: 14px;
      margin-top: 4px;
    }

    .chrome-mini-stats .resource-item { color: #f0e6d8; font-weight: 600; font-size: 12.5px; }
    /* Vinha: Resíduos, Bagaço e Adubo (3 itens) passam à linha de baixo em vez de ficarem cortados */
    #vinha-container .chrome-mini-stats { flex-wrap: wrap; gap: 2px 12px; }
    /* Adega: Bagaço, Aguardente vínica e Bagaceira (3 itens) também passam à linha de baixo em vez de ficarem cortados */
    #garrafa-container .chrome-mini-stats { flex-wrap: wrap; gap: 2px 12px; }

    /* Indicador de passos (ex: quão perto os porcos estão no "Não
       acordes o Chizo", ver chizoIndicadorHtml() em js/proteger.js). */
    .passos-indicador {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
    }

    /* Pegadas 🐾: caixa de tamanho fixo (o cartão não muda de altura
       entre passos); a acesa distingue-se pelo tamanho e pela opacidade,
       não só pela cor. */
    .passos-indicador .passo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      font-size: 9px;
      line-height: 1;
      opacity: 0.4;
      filter: grayscale(1);
    }

    .passos-indicador .passo.ativo {
      font-size: 15px;
      opacity: 1;
      filter: none;
    }

    /* --- Botão-pastilha (trabalhos da Vinha) ---------------------------- */
    .pill-scroll-wrap {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: var(--coluna);
      max-width: calc(100vw - 20px);
      bottom: calc(var(--nav-altura) + 8px);
      z-index: 15;
      display: flex;
      align-items: center;
    }

    .pill-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding: 4px 0;
      scrollbar-width: none;
      flex: 1 1 auto;
      min-width: 0;
      /* Margem em cada ponta da fila — pelo menos 12px sempre; quando a
         seta desse lado está visível, js/main.js sobe isto para 56px
         (44px da seta + folga), para o botão nunca ficar escondido por
         baixo dela no fim do deslize. Ver atualizarSetasDaFila(). */
      --pastilhas-margem-esq: 12px;
      --pastilhas-margem-dir: 12px;
    }

    .pill-scroll::-webkit-scrollbar { display: none; }

    /* Espaçadores reais (não padding) nas duas pontas: um scroll container
       com overflow, em alguns motores, ignora padding no lado final —
       um elemento a mais no fluxo é a forma fiável de reservar espaço. */
    .pill-scroll::before {
      content: '';
      flex: 0 0 auto;
      width: var(--pastilhas-margem-esq);
    }

    .pill-scroll::after {
      content: '';
      flex: 0 0 auto;
      width: var(--pastilhas-margem-dir);
    }

    .btn-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(34, 16, 22, 0.85);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn-pill.pill-main {
      background: var(--dourado);
      color: #2a1608;
      border-color: transparent;
    }

    .btn-pill:disabled,
    .btn-pill.pill-off {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-pill .cooldown-suffix {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      opacity: 0.9;
      margin-left: 2px;
    }

    .btn-pill .pill-clock { flex: 0 0 auto; }

    .btn-pill .bonus-suffix {
      font-size: 11px;
      margin-left: 2px;
      color: #d7ffb8;
    }

    .btn-pill.pill-main .bonus-suffix { color: #2f6b1f; }

    /* Colher da Vinha no outono leva até 2 etiquetas de bónus (372-451 px numa linha, mais do que a fila de 340 px):
       só este botão pode quebrar linha e fica com no máximo 272 px, para caber inteiro à vista. */
    .btn-pill[data-acao="colher"] {
      white-space: normal;
      max-width: 272px;
      text-align: center;
    }

    /* Esbatido dos dois lados da fila — genérico (.pill-fade-left /
       .pill-fade-right), pronto para reutilizar noutros ecrãs. */
    .pill-fade {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 64px;
      pointer-events: none;
    }

    .pill-fade-right {
      right: 0;
      background: linear-gradient(to right, rgba(20, 8, 12, 0), rgba(20, 8, 12, 0.95) 60%, rgba(20, 8, 12, 0.95) 100%);
    }

    .pill-fade-left {
      left: 0;
      background: linear-gradient(to left, rgba(20, 8, 12, 0), rgba(20, 8, 12, 0.95) 60%, rgba(20, 8, 12, 0.95) 100%);
    }

    /* Setas redondas dos dois lados — genéricas, prontas para reutilizar
       noutros ecrãs. Escondem-se (.oculto) quando não há mais para
       deslizar desse lado (ver configurarFilaPastilhas() em js/main.js). */
    .pill-arrow-btn {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--dourado);
      background: var(--vinho-escuro-forte);
      color: #f5d76e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }

    .pill-arrow-right { margin-left: -44px; }
    .pill-arrow-left { margin-right: -44px; }

    .oculto { display: none; }

    /* --- Painel de ações genérico: fila de pastilhas, grelha, lista de
       escolhas ou um único botão grande — sempre encostado por cima da
       barra de navegação. Usado por todos os ecrãs do jogo. ------------ */
    .action-panel {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: var(--coluna);
      max-width: calc(100vw - 20px);
      bottom: calc(var(--nav-altura) + 8px);
      z-index: 15;
      max-height: 42vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }


    /* Seguir o barril (pista Adega, ver renderBarril() em js/proteger.js): 3 barris numa fila; cada um
       desliza para a posição --slot (0 a 2). Com "reduzir movimento" a troca é instantânea. */
    .barris-legenda {
      margin: 0;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 14.5px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      min-height: 20px;
    }
    .barris-fila { position: relative; height: 92px; }
    .barril-btn {
      position: absolute;
      left: 0;
      top: 0;
      width: 33.333%;
      height: 100%;
      min-width: 44px;
      min-height: 44px;
      padding: 4px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(34, 16, 22, 0.85);
      color: #2b1a10;
      cursor: pointer;
      opacity: 1;
      transform: translateX(calc(var(--slot, 0) * 100%));
      transition: transform 0.5s ease-in-out, border-color 0.2s, box-shadow 0.2s;
    }
    .barril-btn:disabled { cursor: default; opacity: 1; }
    /* A imagem do barril ocupa o botão todo mas não apanha o toque: quem recebe o clique é sempre o botão (min. 44 px). */
    .barril-img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 10px; pointer-events: none; user-select: none; -webkit-user-drag: none; }
    .barril-btn.marcado { border-color: #f2c14e; box-shadow: 0 0 0 3px rgba(242, 193, 78, 0.55), 0 0 14px rgba(242, 193, 78, 0.8); }
    @media (prefers-reduced-motion: reduce) {
      .barril-btn { transition: none; }
    }

    /* Grelha 2x2 (ex: os 4 Montes do Proteger) */
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-tile {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(34, 16, 22, 0.85);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 14.5px;
      cursor: pointer;
    }

    .btn-tile:active { transform: scale(0.97); }

    /* Lista vertical de escolhas com frase completa (ex: a Fechadura) */
    .choice-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-choice {
      min-height: 48px;
      display: flex;
      align-items: center;
      text-align: left;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(34, 16, 22, 0.85);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      line-height: 1.3;
      padding: 8px 14px;
      cursor: pointer;
    }

    /* Botão-pastilha grande, sozinho (ex: "Alertar o Chizo!", "Jogar
       Novamente") — reaproveita .btn-pill, só muda a largura/altura. */
    .btn-pill.pill-grande {
      width: 100%;
      min-height: 52px;
      font-size: 16px;
    }

    /* Botão-fantasma pequeno, para uma ação secundária isolada (ex:
       "Sair da Quinta"). */
    .btn-ghost {
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: #f0e6d8;
      font-size: 13px;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
    }

    /* "As minhas garrafas" (só no ecrã A Coleção): fundo e contorno como os cartões da
       Coleção, texto dourado; mesma altura e borda de 1px do btn-ghost. */
    #screen-colecao .action-panel .btn-ghost {
      background: rgba(12, 14, 22, 0.88);
      border-color: rgba(245, 215, 110, 0.4);
      color: #f5d76e;
      font-weight: 700;
    }

    /* Painel com scroll interno, no máximo metade do ecrã (ex: a
       Enciclopédia, ou uma história comprida do Explorar). */
    .scroll-panel {
      max-height: 48vh;
      overflow-y: auto;
      background: var(--vinho-escuro);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(245, 215, 110, 0.3);
      border-radius: 14px;
      padding: 10px 12px;
      text-align: left;
    }

    /* --- Balão de fala (personagem) -------------------------------------- */
    .dialogue-bubble {
      display: flex;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: var(--coluna);
      max-width: calc(100vw - 20px);
      /* Empilhado por cima do painel de ações e do cartão de "nova
         entrada", se algum deles estiver visível — a altura exata é
         medida e posta em --balao-extra por reposicionarFlutuantes(),
         em js/main.js, porque cada ecrã tem alturas diferentes. */
      bottom: calc(var(--nav-altura) + 8px + var(--balao-extra, 0px));
      z-index: 17;
      align-items: center;
      gap: 10px;
      background: var(--vinho-escuro-forte);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(245, 215, 110, 0.35);
      border-radius: 16px;
      padding: 8px 12px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .dialogue-avatar {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      overflow: hidden;
    }

    /* Cara da personagem (ver mostrarCaraNoBalao() em js/personagens.js) */
    .dialogue-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dialogue-text { min-width: 0; text-align: left; }

    .dialogue-name {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 13px;
      font-weight: 600;
      color: #f5d76e;
      margin: 0 0 1px;
    }

    .dialogue-msg {
      font-size: 12.5px;
      line-height: 1.3;
      color: #fff;
      margin: 0;
    }

    /* Seta a piscar devagar — avisa que há mais mensagens na fila (ver
       mostrarFalas()/avancarFala() em js/main.js). Some sozinha na
       última mensagem. */
    .dialogue-next {
      flex: 0 0 auto;
      color: #f5d76e;
      animation: dialogoSetaPiscar 1.6s ease-in-out infinite;
    }

    @keyframes dialogoSetaPiscar {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }

    /* --- Cartão de "nova entrada desbloqueada" ---------------------------
       Pequeno, só com a etiqueta + o título, e uma pastilha para ler a
       entrada completa na Enciclopédia. Fica encostado por cima do
       painel de ações (ver reposicionarFlutuantes() em js/main.js). */
    .unlock-card {
      display: flex;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: var(--coluna);
      max-width: calc(100vw - 20px);
      bottom: calc(var(--nav-altura) + 8px + var(--pilha-abaixo, 0px));
      z-index: 16;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--vinho-escuro-forte);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 16px;
      padding: 8px 10px 8px 12px;
      margin-bottom: 6px;
    }

    .unlock-card[hidden] { display: none; }

    .unlock-textos { min-width: 0; text-align: left; }

    .unlock-label {
      font-size: 10.5px;
      font-weight: 700;
      color: #f5d76e;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .unlock-titulo {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 14px;
      color: #fff;
      margin: 2px 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unlock-card .btn-pill {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 16px;
    }

    /* --- Barra de navegação de baixo ------------------------------------- */
    #app-bottomnav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: var(--coluna);
      max-width: calc(100vw - 20px);
      bottom: 0;
      padding-bottom: var(--nav-offset);
      z-index: 20;
      background: var(--vinho-escuro-forte);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 215, 110, 0.3);
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      align-items: stretch;
      justify-content: space-between;
    }

    .nav-btn {
      flex: 1 1 0;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: none;
      border: none;
      color: #d8cfc2;
      font-family: 'Nunito', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 2px;
    }

    .nav-btn.active {
      color: var(--dourado);
    }

    .nav-btn-home {
      transform: translateY(-6px);
    }

    .nav-btn-home svg {
      width: 24px;
      height: 24px;
    }

    /* Ecrã ainda trancado por nível (ver ecraDesbloqueado() em
       js/niveis.js e atualizarNavBloqueios() em js/main.js) — ícone
       acinzentado, com um pequeno cadeado no canto. Continua a poder
       tocar-se (mostra a mensagem "Abre no Nível...", ver goTo()). */
    .nav-btn.trancado {
      opacity: 0.45;
      position: relative;
    }

    .nav-btn.trancado::after {
      content: '🔒';
      position: absolute;
      top: 2px;
      right: 20%;
      font-size: 10px;
    }

    /* --- Cartão/link de saída no Menu da Quinta -------------------------- */
    .quinta-exit-link {
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #f0e6d8;
      font-size: 13px;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      padding: 0 14px;
      margin: 0 auto;
    }

    /* O conteúdo "clássico" (caixa opaca, centrado) desliga-se em
       qualquer ecrã do jogo — tudo passa a viver em peças fixas (cartão
       do topo, balão, painel de ações, painel com scroll), por isso o
       próprio contentor do ecrã não precisa de fundo nem de padding.
       Repetido por id (em vez de só ".screen.active") para ter
       especificidade suficiente para ganhar a ".screen.content:not(
       #screen-home)" mais acima, que tem um id lá dentro do :not(). */
    body.jogo-cheio #screen-quinta.content,
    body.jogo-cheio #screen-vinha.content,
    body.jogo-cheio #screen-proteger.content,
    body.jogo-cheio #screen-garrafa.content,
    body.jogo-cheio #screen-engarrafar.content,
    body.jogo-cheio #screen-explorar.content,
    body.jogo-cheio #screen-enciclopedia.content,
    body.jogo-cheio #screen-perfil.content,
    body.jogo-cheio #screen-conquistas.content,
    body.jogo-cheio #screen-caderno.content,
    body.jogo-cheio #screen-colecao.content,
    body.jogo-cheio #screen-estrada.content,
    body.jogo-cheio #screen-lagar.content,
    body.jogo-cheio #screen-camara.content,
    body.jogo-cheio #screen-roxo.content,
    body.jogo-cheio #screen-loja.content,
    body.jogo-cheio #screen-garrafas.content,
    body.jogo-cheio #screen-festa.content {
      background: none;
      border: none;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      padding: 0;
      text-align: left;
      max-height: none;
      overflow: visible;
    }

    /* Painel com scroll interno (Enciclopédia, histórias compridas):
       flutua entre o cartão do topo e o painel de ações. */
    .scroll-panel {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(var(--topo-altura) + 60px);
      width: var(--coluna);
      max-width: calc(100vw - 20px);
      z-index: 14;
    }

    /* Fundo em ecrã inteiro (cover), sem faixas escuras à volta — em
       qualquer ecrã do jogo; a capa e a escolha de língua mantêm a
       caixa de foto (com moldura desfocada) como já estava. */
    body.jogo-cheio #fundo.modo-foto .fundo-nitido {
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      transform: none;
      -webkit-mask-image: none;
      mask-image: none;
      background-size: cover;
      background-position: center;
    }

    /* Em ecrãs mais largos do que altos (PC), a imagem nítida volta a
       ficar só na coluna central de telemóvel (a mesma largura da
       barra de topo, do cartão, etc. — ver --coluna), em vez de esticar
       para a janela toda: era isso que cortava a cabeça das
       personagens. Dos lados, quem preenche é a mesma foto desfocada e
       escurecida (.fundo-desfocado, já em ecrã inteiro por omissão). */
    @media (orientation: landscape) {
      body.jogo-cheio #fundo.modo-foto .fundo-nitido {
        left: 50%;
        right: auto;
        width: var(--coluna);
        transform: translateX(-50%);
      }
    }

    /* Algumas fotos têm céu claro no topo — sem nada a escurecer aí, a
       barra de topo perde contraste em cima delas. Junta um leve
       escurecimento também no topo (o de baixo, para a janela antiga,
       mantém-se). */
    body.jogo-cheio .overlay {
      background:
        linear-gradient(to top, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.1) 35%, rgba(0,0,0,0) 55%),
        linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 22%);
    }

    /* --- Ecrã inicial e Escolher Língua: botões mais discretos, no
       mesmo estilo geral (Nunito, dourado/vinho), sem caixa grande. --- */
    body.tela-home .home-botoes .btn,
    #screen-lingua .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      border-radius: 12px;
    }

      color: #2a1608;
    }

      font-size: 15px;
      background: rgba(34, 16, 22, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
    }
  </style>
</head>
